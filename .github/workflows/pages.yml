name: Publish course site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out course materials
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check discovery, source previews, and all local links
        run: python -m unittest discover -s site -p 'test_*.py' -v
      - name: Build the course library
        run: python site/build.py
      - name: Set up Node for browser checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/browser-tests/package-lock.json
      - name: Install browser test tools
        working-directory: site/browser-tests
        run: npm ci
      - name: Install Chromium
        working-directory: site/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Verify the student practice flow
        working-directory: site/browser-tests
        run: npm test
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
